name: Update HRRR Wind Data

# CADENCE (2026-10-05): a self-re-dispatching chain, the pattern firestorm-goes-fire-data
# proved. GitHub's `schedule` is best-effort: measured 2026-10-05, this cron ran only ~5
# times a day (24/day designed). Each run queues its successor FIRST (the concurrency
# group holds it until this run ends, so a failed or cancelled run cannot break the chain),
# does its work, then waits out the rest of a 60-min slot. The cron is now only a dead-man restart.
on:
  # HRRR CONUS publishes hourly; Alaska every 3h. We run hourly — Alaska
  # outputs simply repeat for 1-2 runs out of 3 without harm.
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write                 # self re-dispatch

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: update-hrrr
      cancel-in-progress: false
    timeout-minutes: 75
    steps:
      - name: mark the slot start
        run: echo "SLOT_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: queue the next run (first, so this run cannot break the chain)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run update-hrrr.yml --ref main || echo "::warning::re-dispatch failed; the schedule will restart the chain"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch and resample HRRR wind
        run: python fetch_hrrr.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only commit JSON outputs — never .grib2 or temp files
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "Update HRRR wind data — ${TIMESTAMP}"
            git pull --rebase origin main || true
            git push
          fi

      - name: wait out the rest of the 60-min slot
        if: always()
        run: |
          left=$(( 3600 - ($(date +%s) - SLOT_START) ))
          if [ "$left" -gt 0 ]; then echo "sleeping ${left}s to the next slot"; sleep "$left"; fi
